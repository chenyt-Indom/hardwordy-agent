name: Bug 报告
description: 启动失败、界面报错、某个功能结果不对
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提之前先做两件事，能省掉一半来回：

        1. **抓日志**：源码版整合包看 `app\data\app.log`；源码运行看启动窗口里的 traceback。
        2. **确认不是杀软误报**：`python.exe` / `ffmpeg.exe` / `node.exe` 被报毒属启发式误报，见 README「杀软误报」一节，不是病毒。

        只写「用不了」的 issue 没法定位，请尽量贴报错原文。
  - type: dropdown
    id: how_run
    attributes:
      label: 你是怎么跑的
      options:
        - 源码版整合包 2026.11.21b（双击 一键启动.bat）
        - 源码运行（python run.py）
        - Docker（一键部署.bat）
        - 更早的 PyInstaller 单 exe 版本
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统 + 显卡/显存 + 内存；用本地模型的话写模型名
      placeholder: Windows 11 / RTX 5070 Ti 12GB / 32GB / qwen3-vl-think:30b
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 你期望发生什么，实际发生了什么。有截图更好（可直接拖进来）
      placeholder: 点「发送」后卡片一直是空白，刷新后消息也没了
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 http://127.0.0.1:8000
        2. 顶栏选「本地 8B」
        3. 输入「把昨天的日志整理成表格」
        4. 卡片空白，控制台报 xxx
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 日志 / 报错原文
      description: 贴 `app\data\app.log` 最后 50 行，或 traceback 全文（用代码块包起来）
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: selfcheck
    attributes:
      label: 提交前自查
      options:
        - label: 我搜索过已有 issue / Discussions，没有重复
          required: true
        - label: 我贴了日志或报错原文（不是只写「用不了」）
          required: false
